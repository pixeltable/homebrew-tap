name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-15-intel, macos-14, macos-15 ]
        include:
          - os: ubuntu-latest
            container: ghcr.io/homebrew/brew:main
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v6
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      # Ungated so it also runs on push to main, but be aware of what it does NOT do:
      # `detect_formulae!` diffs HEAD against origin/main, and on a push to main those
      # are the same commit, so nothing is ever detected and no formula is built or
      # bottled. It has never built pxt on any platform or produced a bottle artifact.
      # To get real four-platform build and bottle coverage, name the formula so
      # detection is bypassed: `brew test-bot --only-formulae pixeltable/tap/pxt`.
      # That is deliberately not done here: it would add ~10 minutes to every push to
      # cover Linux, which this tap does not support, and bottles, which are not
      # shipped. Formula builds are covered by ci.yml and by update-formula.yml before
      # it commits. Turn it on when Phase 2 bottling starts.
      - run: brew test-bot --only-formulae

      - name: Upload bottles as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
