name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Bottle builder only. Three legs were removed after PR #9, the first formula
        # change to reach `--only-formulae`, showed what they actually do:
        #   macos-14, macos-15-intel:
        #                  test-bot skips pxt outright ("dependencies without compatible
        #                  bottles: python@3.12"); homebrew-core no longer bottles
        #                  python@3.12 for Sonoma or for Intel Sequoia. Permanent green
        #                  no-ops. ci.yml still builds and tests both for real.
        #   ubuntu-latest: the formula installs, then `brew bottle` fails inside patchelf
        #                  ("No PT_LOAD found covers offset") rewriting a vendored ELF,
        #                  and `brew linkage --test` rejects the vendored PostgreSQL and
        #                  wheel binaries. Linux is unsupported; see README.
        # Consequence: bottles are only possible for arm64 Sequoia (and newer) until
        # this tap also bottles python@3.12 itself.
        os: [ macos-15 ]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v6
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      # On a pull request that changes Formula/pxt.rb, `detect_formulae!` finds it and
      # this step builds, tests and bottles it (bottles upload as artifacts below). On
      # a push to main it detects nothing: it diffs HEAD against origin/main, which are
      # the same commit. So automated bumps pushed straight to main are covered by
      # ci.yml and by update-formula.yml's own build, not by this step. To force a
      # build regardless of detection, name the formula:
      #   brew test-bot --only-formulae pixeltable/tap/pxt
      - run: brew test-bot --only-formulae

      - name: Upload bottles as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
