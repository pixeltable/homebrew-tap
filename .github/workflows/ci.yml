name: CI Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  matrix-test:
    name: Test Formula on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-15-intel]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Link Tap into Homebrew
        run: |
          TAP_DIR="$(brew --repository pixeltable/tap)"
          mkdir -p "$(dirname "$TAP_DIR")"
          rm -rf "$TAP_DIR"
          ln -s "$GITHUB_WORKSPACE" "$TAP_DIR"

      - name: Prepare Python 3.12 Environment
        run: |
          # `brew install` exits 1 when its own link phase meets the macos-15-intel
          # image's python.org framework symlinks in /usr/local/bin, even though the
          # keg poured fine. The --overwrite link below deletes those foreign links
          # and finishes the setup; if install failed for a real reason there is no
          # keg and the strict link still fails the step.
          brew list --versions python@3.12 >/dev/null || brew install python@3.12 || true
          brew link --overwrite python@3.12

      # Style the tap, not just the formula: this also runs shellcheck and shfmt over
      # scripts/, matching what `brew test-bot --only-tap-syntax` enforces in CI.
      - name: Verify Tap Style
        run: |
          brew style pixeltable/tap

      - name: Verify Livecheck
        run: |
          brew livecheck pixeltable/tap/pxt

      - name: Run Homebrew Formula Audit
        run: |
          brew audit --tap pixeltable/tap

      - name: Install Formula from Source
        run: |
          brew install --verbose --build-from-source pixeltable/tap/pxt

      - name: Execute Formula Test Suite
        run: |
          brew test pixeltable/tap/pxt

      # Guards the failure the @rpath normalisation in Formula/pxt.rb exists to prevent.
      # A dependency bump can add a library with an absolute install name, and Homebrew
      # only overflows the Mach-O header at install time, so assert it explicitly.
      - name: Assert Mach-O Install Names Stay Relocatable
        run: ./scripts/check-macho-install-names.sh

      - name: Supplementary CLI Smoke & Service Verification
        run: |
          BREW_PREFIX="$(brew --prefix)"
          PATH="${BREW_PREFIX}/bin:$PATH"
          export PATH
          PIXELTABLE_HOME="$(mktemp -d)"
          export PIXELTABLE_HOME

          # Bind an ephemeral port instead of a fixed one: `pxt daemon stop -f` kills
          # whatever holds the port, and runners are not guaranteed to be exclusive.
          PXT_PORT="$(python3 -c "import socket; s = socket.socket(); s.bind(('127.0.0.1', 0)); port = s.getsockname()[1]; s.close(); print(port)")"
          export PXT_PORT
          echo "Using PXT_PORT=${PXT_PORT}"

          # 1. Inspect version and help
          pxt --version
          pxt --help

          # 2. Test project scaffolding
          TEST_DIR="$(mktemp -d)"
          cd "$TEST_DIR"
          pxt init
          test -f pixeltable.toml

          # 3. Test schema and service CLI parsing (requires [serve] extra)
          pxt schema example --brief
          pxt service example --out app.py
          test -f app.py

          # 4. Verify catalog inspection and database health
          pxt status

          # Cleanup
          pxt daemon stop -f || true
          rm -rf "$PIXELTABLE_HOME" "$TEST_DIR"
