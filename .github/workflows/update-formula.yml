name: Update Formula on PyPI Release

on:
  schedule:
    - cron: "0 */6 * * *"
  repository_dispatch:
    types: [pixeltable-published]
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit Pixeltable version to bump (optional)"
        required: false
        type: string
      force:
        description: "Force formula validation and push even if version has not changed"
        required: false
        type: boolean
        default: false

concurrency:
  group: update-formula
  cancel-in-progress: false

jobs:
  check-and-update:
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Tap Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Untrusted values reach this job through `client_payload` and `inputs`. They are
      # passed through `env` and read with os.environ, never interpolated into the script
      # body: GitHub expands `${{ }}` before the shell runs, so heredoc quoting alone
      # would not stop a payload from breaking out and executing on a runner that holds
      # `contents: write`.
      - name: Fetch PyPI Release & Compute Checksum
        id: pypi
        env:
          VERSION_OVERRIDE: ${{ github.event.client_payload.version || inputs.version }}
        run: |
          set -euo pipefail
          python3 - << 'EOF'
          import os, json, re, time, urllib.request

          raw_override = os.environ.get("VERSION_OVERRIDE", "").strip()
          override = raw_override.removeprefix("v") if raw_override else ""
          # The version later reaches GITHUB_OUTPUT, branch names, and PR text; it must
          # be version-shaped, not free text.
          if override and not re.fullmatch(r"[0-9][0-9A-Za-z.\-_+]{0,63}", override):
              raise RuntimeError(f"Refusing malformed version override: {override!r}")

          # Retry on every trigger: the PyPI JSON API can briefly disagree with the CDN
          # right after a publish, for dispatched and auto-detected versions alike.
          max_attempts = 6
          wheel = None
          version = None
          url = None
          sha256 = None

          for attempt in range(1, max_attempts + 1):
              try:
                  req = urllib.request.Request(
                      "https://pypi.org/pypi/pixeltable/json",
                      headers={"User-Agent": "pixeltable-homebrew-tap-updater"}
                  )
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read().decode("utf-8"))

                  version = override if override else data["info"]["version"]
                  if not re.fullmatch(r"[0-9][0-9A-Za-z.\-_+]{0,63}", version):
                      raise RuntimeError(f"Refusing malformed version string from PyPI: {version!r}")

                  releases = data.get("releases", {}).get(version, [])
                  if not releases and version == data.get("info", {}).get("version"):
                      releases = data.get("urls", [])

                  wheel = next(
                      (
                          r for r in releases
                          if r.get("filename", "").endswith(".whl") and not r.get("yanked")
                      ),
                      None,
                  )
                  if wheel:
                      url = wheel["url"]
                      sha256 = wheel["digests"]["sha256"]
                      break

                  print(f"Attempt {attempt}/{max_attempts}: Release '{version}' or wheel not found yet on PyPI...")
              except Exception as e:
                  print(f"Attempt {attempt}/{max_attempts}: Request error: {e}")

              if attempt < max_attempts:
                  time.sleep(10)

          if not wheel:
              raise RuntimeError(f"No .whl package found on PyPI for Pixeltable release '{version}' after {max_attempts} attempts.")

          # PyPI is the only source for these three values, and each is validated before
          # it reaches the formula, so a compromised response cannot inject Ruby.
          if not url.startswith("https://files.pythonhosted.org/packages/") or not url.endswith(".whl"):
              raise RuntimeError(f"Refusing unexpected wheel URL: {url}")
          if len(sha256) != 64 or not all(c in "0123456789abcdef" for c in sha256.lower()):
              raise RuntimeError(f"Refusing malformed sha256: {sha256}")

          print(f"Target Version: {version}")
          print(f"Wheel URL: {url}")
          print(f"SHA256: {sha256}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={version}\n")
              f.write(f"url={url}\n")
              f.write(f"sha256={sha256}\n")
          EOF

      - name: Determine If Update Required
        id: check
        env:
          TARGET_VERSION: ${{ steps.pypi.outputs.version }}
          FORCE_UPDATE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          python3 - << 'EOF'
          import os, re

          with open("Formula/pxt.rb", "r") as f:
              content = f.read()

          m = re.search(r'url\s+"https://files\.pythonhosted\.org/packages/[^"]+/pixeltable-([0-9a-zA-Z\.\_\+]+?)(?:-[^/]+)?\.whl"', content)
          # A miss here means the formula URL drifted from what the rewrite step below
          # substitutes. Fail loudly: otherwise the run would report "updated" while the
          # rewrite no-ops and the formula quietly goes stale forever.
          if not m:
              raise RuntimeError("Could not parse the wheel URL in Formula/pxt.rb")
          current_ver = m.group(1)
          target_ver = os.environ["TARGET_VERSION"]
          force_update = os.environ.get("FORCE_UPDATE", "").lower() in ["true", "1"]

          print(f"Current formula version: {current_ver}")
          print(f"Target PyPI version:    {target_ver}")
          print(f"Force update flag:       {force_update}")

          # Minimal PEP 440 ordering: a numeric release tuple plus a stage tuple,
          # dev < a < b < rc < final < post. A post on a prerelease sits just above
          # that prerelease but below the final. Trailing zeros are dropped so
          # "0.7" and "0.7.0" compare equal, and anything off this shape returns
          # None, which the check below treats as "cannot prove newer: skip".
          PRE_RANK = {"dev": 0, "a": 1, "b": 2, "rc": 3}

          def ver_key(v):
              m2 = re.fullmatch(
                  r"(\d+(?:\.\d+)*)(?:\.?(dev|a|b|rc)(\d*))?(?:\.?post(\d*))?",
                  v.replace("-", ".").replace("_", "."),
              )
              if not m2:
                  return None
              release = tuple(int(x) for x in m2.group(1).split("."))
              while release and release[-1] == 0:
                  release = release[:-1]
              pre, post = m2.group(2), m2.group(4)
              if pre is None:
                  stage = (2 if post is not None else 1, 0, 0, int(post or 0))
              else:
                  stage = (0, PRE_RANK[pre], int(m2.group(3) or 0), int(post or 0))
              return (release, stage)

          t_key, c_key = ver_key(target_ver), ver_key(current_ver)
          if t_key is not None and c_key is not None and t_key > c_key:
              should_update = True
          elif target_ver != current_ver:
              # PyPI reports an older or non-comparable latest (e.g. after a
              # yank): never downgrade or move sideways silently.
              print(f"warning: target {target_ver} is not newer than formula {current_ver}; skipping")
              should_update = False
          else:
              should_update = False

          if force_update:
              # Force covers validation runs and deliberate rollbacks.
              should_update = True

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"should_update={'true' if should_update else 'false'}\n")
              f.write(f"current_version={current_ver}\n")
          EOF

      - name: Update Formula/pxt.rb
        if: steps.check.outputs.should_update == 'true'
        env:
          NEW_URL: ${{ steps.pypi.outputs.url }}
          NEW_SHA: ${{ steps.pypi.outputs.sha256 }}
        run: |
          set -euo pipefail
          python3 - << 'EOF'
          import os, re

          new_url = os.environ["NEW_URL"]
          new_sha = os.environ["NEW_SHA"]

          with open("Formula/pxt.rb", "r") as f:
              content = f.read()

          content = re.sub(
              r'url\s+"https://files\.pythonhosted\.org/packages/[^"]+/pixeltable-[^"]+\.whl"',
              lambda _: f'url "{new_url}"',
              content,
              count=1
          )
          content = re.sub(
              r'sha256\s+"[0-9a-fA-F]{64}"',
              lambda _: f'sha256 "{new_sha}"',
              content,
              count=1
          )

          # Without this, a URL or sha line that drifts from the patterns above would
          # leave the formula unchanged and the commit step would no-op "successfully".
          if f'url "{new_url}"' not in content:
              raise RuntimeError("Formula rewrite failed: new wheel URL not present after substitution")
          if f'sha256 "{new_sha}"' not in content:
              raise RuntimeError("Formula rewrite failed: new sha256 not present after substitution")

          with open("Formula/pxt.rb", "w") as f:
              f.write(content)
          EOF

      - name: Set up Tap Path for Homebrew
        if: steps.check.outputs.should_update == 'true'
        run: |
          TAP_DIR="$(brew --repository pixeltable/tap)"
          mkdir -p "$(dirname "$TAP_DIR")"
          rm -rf "$TAP_DIR"
          ln -s "$GITHUB_WORKSPACE" "$TAP_DIR"

      - name: Prepare Python 3.12 Environment
        if: steps.check.outputs.should_update == 'true'
        run: |
          # `brew install` exits 1 when its own link phase meets foreign
          # /usr/local/bin symlinks (e.g. a python.org framework Python on the
          # Intel runner image), even though the keg poured fine. The --overwrite
          # link below deletes those foreign links and finishes the setup; if
          # install failed for a real reason there is no keg and the strict link
          # still fails the step.
          brew list --versions python@3.12 >/dev/null || brew install python@3.12 || true
          brew link --overwrite python@3.12

      - name: Validate & Test Updated Formula
        if: steps.check.outputs.should_update == 'true'
        run: |
          brew style pixeltable/tap
          brew livecheck pixeltable/tap/pxt
          brew audit --tap pixeltable/tap
          brew install --verbose --build-from-source pixeltable/tap/pxt
          brew test pixeltable/tap/pxt

      # A new wheel can pull in a dependency whose vendored dylibs carry absolute install
      # names. Homebrew rewrites those to long opt paths and the Mach-O header overflows,
      # so assert the invariant here rather than discovering it in a user's install.
      - name: Assert Mach-O Install Names Stay Relocatable
        if: steps.check.outputs.should_update == 'true'
        run: ./scripts/check-macho-install-names.sh

      - name: Commit and Push Update to main
        id: push_step
        if: steps.check.outputs.should_update == 'true'
        env:
          NEW_VERSION: ${{ steps.pypi.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet Formula/pxt.rb; then
            echo "No changes detected in Formula/pxt.rb"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/pxt.rb
          git commit -m "chore(formula): bump pxt to ${NEW_VERSION}"
          if git push origin main; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "Successfully pushed formula update directly to main."
          else
            if git pull --rebase origin main && git push origin main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              echo "Successfully pushed formula update after rebase."
            else
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              echo "Direct push was rejected (e.g. branch protection). Falling back to Pull Request..."
            fi
          fi

      - name: Create Pull Request (Fallback)
        if: steps.check.outputs.should_update == 'true' && steps.push_step.outputs.pushed == 'false'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(formula): bump pxt to ${{ steps.pypi.outputs.version }}"
          branch: "bump-pxt-v${{ steps.pypi.outputs.version }}"
          title: "Bump pxt to v${{ steps.pypi.outputs.version }}"
          body: |
            Automated formula bump for Pixeltable release `${{ steps.pypi.outputs.version }}`.

            - **Wheel URL:** `${{ steps.pypi.outputs.url }}`
            - **SHA256:** `${{ steps.pypi.outputs.sha256 }}`
            - **Verification:** Passed `brew style`, `brew livecheck`, `brew audit --tap`, source installation, and integration tests (`brew test`).
          labels: |
            dependencies
            automated-pr
